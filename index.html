<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=moonwalk" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101815" />
    <meta name="description" content="Find your next adventure with Moonwalk. Buy and sell cars &amp; campers in New Zealand." />
    <link rel="preload" href="/branding/moonwalk-moon.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/fonts/manrope/manrope-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <title>Moonwalk — Cars &amp; campers in New Zealand</title>
    <style>
      /* Visible immediately, before the application bundle is ready. */
      body { margin: 0; background: #f3f7f1; }
      .app-boot { display: grid; min-height: 100vh; min-height: 100dvh; place-items: center; }
      .app-boot-moon { display: block; width: 64px; height: 64px; animation: moonwalk-boot-spin 1.2s cubic-bezier(.55,.08,.45,.92) infinite; }
      .app-boot-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
      @keyframes moonwalk-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-boot-moon { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite">
        <img class="app-boot-moon" src="/branding/moonwalk-moon.svg" width="64" height="64" alt="" />
        <span class="app-boot-label">Loading Moonwalk</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
